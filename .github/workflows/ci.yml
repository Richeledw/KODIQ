name: Eduplat CI

on:
    push:
        branches: [main, master]
    pull_request:
        branches: [main, master]

jobs:
    build-and-test:
        name: Build, Lint & Test (Node ${{ matrix.node-version }})
        runs-on: ubuntu-latest

        strategy:
            matrix:
                node-version: [20.x, 22.x]

        steps:
            - name: Checkout de código
              uses: actions/checkout@v4

            - name: Configurar Node.js ${{ matrix.node-version }}
              uses: actions/setup-node@v4
              with:
                  node-version: ${{ matrix.node-version }}
                  cache: 'npm'

            - name: Instalar dependencias
              run: npm ci

            - name: Análisis estático con ESLint
              run: npm run lint

            - name: Ejecución de suite de pruebas automatizadas
              run: npm test
              env:
                  NODE_ENV: test
                  SESSION_SECRET: ci_test_secret_for_eduplat_1234567890
                  APP_URL: http://localhost:3000

            - name: Auditoría de seguridad de dependencias
              run: npm audit --audit-level=high
